<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <title>Johann Schwarze - Message received</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      margin: 0 auto;
    }

    .header,
    .footer {
      width: 90%;
      margin: 0 auto;
      padding: 10px;
      text-align: center;
      border-bottom: 4px solid #1f242d;
    }

    ul {
      width: 100%;
      margin: 0 auto;
      list-style: none;
      padding: 0;
      overflow: hidden;
    }

    li {
      float: left;
      margin-right: 10%;
    }

    li img {
      width: 26px;
      height: auto;
      margin-top: -5px;
    }

    li:last-child {
      float: left;
      margin-right: 0;
    }

    .main {
      padding: 20px;
      text-align: center;
      margin-bottom: 20px;
      color: #001C25;
    }

    .section {
      width: 50%;
      padding: 5px;
      margin: 0 auto;

    }

    .section span {
      font-weight: bold;
      padding: 5px;
    }

    .img-main {
      max-width: 300px;
      margin: 0 auto;
    }

    .footer {
      background-color: none;

    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">

      <ul>
        <li>

          <span style="font-size: 24px; font-weight: bold; ">Johann Schwarze</span>
        </li>

      </ul>
    </div>

    <div class="main">
      <div class="section">
        <span style="font-size: 24px; margin-bottom: 10px;">I have received your message successfully</span>
      </div>

      <div class=" section">
        <span>Message:</span>
        {{message}}
      </div>


      <div class="section">
        <span>Name:</span>
        {{sName}}
      </div>



      <p class="section">
        <span>Email:</span>
        {{Email}}
      </p>

      <p class="lastParrafo">
        I will reply to your message as soon as possible!
      </p>
    </div>


    <div class="footer">
      <a href="https://johannschwarze.com" style="text-decoration: none; color: black;" target="_blank">
        <div style="flex: auto; text-align: center;">johannschwarze.com</div>
      </a>
    </div>
  </div>
</body>

<script src="src/test.js"></script>

</html>
